[project]
name = "gramel"
version = "0.0.1"
description = "Parametric CAD model of a double-blade violin purfling cutter (build123d)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Paul Fremantle" }]
dependencies = [
    "pydantic>=2.10",
    "build123d",
    "bd-warehouse",
    "build123d-drafting-helpers>=0.1.1",
    "cairosvg",
    "markdown-pdf>=1.3",
    "pypdf>=5.0",
    "pip-hinge>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.7",
    "black>=24.0",
    "trimesh>=4.12.2",
    "manifold3d>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gramel"]

# --- Tooling ---------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "RUF001", # ambiguous Unicode in strings — we use × / − / → matching the spec
    "RUF002", # ditto for docstrings
    "RUF003", # ditto for comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]  # assert False is fine in tests

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_forbid_extra = true
# init_typed = false (default) — allows dict construction (idiomatic pydantic).
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers"]
