# estampo.toml — reproducible print pipeline for the gramil case
# Run: estampo run
# Docs: https://github.com/estampo/estampo

name = "gramil-case"
output_dir = "estampo_output"

[pipeline]
# gcode-info prints time + filament usage; pack repacks for Bambu AMS
stages = ["load", "arrange", "plate", "slice", "gcode-info", "pack"]

[plate]
size = [256, 256]   # Bambu P1S bed (mm)
padding = 5.0

[slicer]
engine   = "orca"
version  = "2.3.1"                # pin for reproducibility
bed_type = "Textured PEI Plate"   # physical plate on P1S — do not remove

[slicer.orca]
printer   = "Bambu Lab P1S 0.4 nozzle"
process   = "0.20mm Standard @BBL X1C"
filaments = ["Generic PLA @base"]   # load black PLA in AMS slot 1 (generic/third-party PLA — not Bambu's own)

# Print-in-place overrides — do not change without testing the hinge action.
# The case is designed supportless; supports will jam the hinge.
[slicer.orca.overrides]
enable_support        = "0"       # must be off — ramps are self-supporting by design
wall_loops            = "5"
sparse_infill_density = "30%"
sparse_infill_pattern = "gyroid"
brim_type             = "outer_only"
brim_width            = "8"
brim_object_gap       = "0.15"    # 0.1 fused; acceleration fix (initial_layer_acceleration=500) is the real fix, 0.15 is sufficient
initial_layer_flow_ratio = "1"    # match Bambu Studio — full flow on layer 1 so brim grips the bed more than the part
initial_layer_acceleration = "500"  # BS uses M204 S500 for brim; Orca defaults to 10000 causing blobs that fuse brim to part — needs G-code verification

# Repack sliced output into the .gcode.3mf format Bambu printers require.
# Requires: pip install bambox  (one-time)
[pack]
command = "bambox repack {sliced_3mf}"
output  = "{sliced_3mf}"

[[parts]]
# STL is exported in print orientation (base on bed, lid flat-open beside it)
# so orient=upright preserves that; flat would auto-rotate and break the layout.
file   = "gramil/case/printable/case_print_in_place.stl"
orient = "upright"
