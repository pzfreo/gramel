name: Release

# Push a tag like `v0.1.0` to cut a release.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # also runnable manually for testing — builds but only releases on a tag

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Build production package
        run: uv run python scripts/build_production.py

      - name: Bundle artifacts
        run: |
          # Copy the quotation request alongside the drawings so the zip
          # is a self-contained "send to the shop" package.
          cp quotation-request.md dist/
          cp specification.md dist/
          # Tag name (without leading v) for nice filenames; fall back to "dev".
          TAG=${GITHUB_REF_NAME:-dev}
          ARCHIVE="gramel-${TAG}.zip"
          (cd dist && zip -r "../${ARCHIVE}" .)
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/gramel_drawings.pdf
            ${{ env.ARCHIVE }}
            quotation-request.md

      - name: Upload artifacts (manual run only — no release created)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gramel-production-package
          path: |
            dist/gramel_drawings.pdf
            ${{ env.ARCHIVE }}
            quotation-request.md
