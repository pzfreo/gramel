name: Release

# Push a tag like `v0.1.0` to cut a release.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # also runnable manually for testing — builds but only releases on a tag

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Build production package
        # Produces the per-part STEPs, assembly STEP, per-drawing SVG+PDF,
        # combined drawings PDF, and the version-stamped release zip.
        run: uv run python scripts/build_production.py

      - name: Slice case (estampo)
        uses: estampo/estampo/action@v0
        with:
          config: estampo.toml
          comment: "false"

      - name: Update CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DATE=$(date +%Y-%m-%d)
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${TAG}" --jq '.body')
          # Checkout main explicitly — tag triggers leave the repo in detached HEAD
          git fetch origin main
          git checkout main
          # Re-apply the updated CHANGELOG (checkout may have reset it)
          {
            printf "# Changelog\n\nAll notable changes to this project are documented here.\nThis file is auto-updated by the release workflow on every tagged release.\n\n---\n\n"
            printf "## %s (%s)\n\n%s\n\n---\n\n" "${TAG}" "${DATE}" "${NOTES}"
            tail -n +6 CHANGELOG.md
          } > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for ${TAG}"
          git push origin main

      - name: Find release archive and rename gcode
        run: |
          ARCHIVE=$(ls gramel-*.zip | head -1)
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "Built bundle: ${ARCHIVE}"
          TAG="${GITHUB_REF_NAME:-dev}"
          mv estampo_output/plate_sliced.gcode.3mf "gramel-case-${TAG}.gcode.3mf"
          echo "GCODE=gramel-case-${TAG}.gcode.3mf" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            dist/gramel_drawings.pdf
            dist/step/gramel_assembly.step
            dist/quotation-request.pdf
            ${{ env.GCODE }}
            CHANGELOG.md

      - name: Upload artifacts (manual run only — no release created)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gramel-production-package
          path: |
            ${{ env.ARCHIVE }}
            dist/gramel_drawings.pdf
            dist/step/gramel_assembly.step
            dist/quotation-request.pdf
            ${{ env.GCODE }}
            CHANGELOG.md
